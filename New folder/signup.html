<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SafeHer - Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#ff4d79,#ff7a59);
}

.signup-box{

width:450px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.2);

}

.logo{
text-align:center;
font-size:40px;
margin-bottom:10px;
}

h2{
text-align:center;
color:#ff4d79;
margin-bottom:25px;
}

input{

width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;

}

input:focus{

outline:none;
border-color:#ff4d79;

}

.checkbox{

display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;

}

.checkbox input{

width:auto;
margin:0;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#ff4d79;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#ff2e65;

}

.login-link{

text-align:center;
margin-top:20px;

}

.login-link a{

color:#ff4d79;
text-decoration:none;
font-weight:600;

}

.error{

color:red;
font-size:14px;
margin-bottom:10px;
display:none;

}

@media(max-width:500px){

.signup-box{

width:100%;

}

}

</style>

</head>
<body>

<div class="signup-box">

<div class="logo">🛡</div>

<h2>Create Account</h2>

<form id="signupForm">

<input
type="text"
id="fullname"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<div id="errorMsg" class="error">
Passwords do not match
</div>

<div class="checkbox">

<input
type="checkbox"
id="terms"
required>

<label for="terms">
I agree to the Terms & Conditions
</label>

</div>

<button type="submit">
Create Account
</button>

</form>

<div class="login-link">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

<script>

document
.getElementById("signupForm")
.addEventListener("submit",function(e){

e.preventDefault();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const error =
document.getElementById("errorMsg");

if(password !== confirmPassword){

error.style.display="block";
return;

}

error.style.display="none";

const userData = {

name:
document.getElementById("fullname").value,

email:
document.getElementById("email").value,

phone:
document.getElementById("phone").value

};

localStorage.setItem(
"safeherUser",
JSON.stringify(userData)
);

alert("Account Created Successfully!");

window.location.href="login.html";

});

</script>

</body>
</html>
