<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SafeHer Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d79,#ff7a59);
}

.login-box{

width:400px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:35px;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:25px;
color:#ff4d79;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:14px;
background:#ff4d79;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#ff2d63;
}

.signup{
text-align:center;
margin-top:20px;
}

.signup a{
color:#ff4d79;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">🛡</div>

<h2>SafeHer Login</h2>

<form>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button type="submit">
Login
</button>

</form>

<div class="signup">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</div>

</body>
</html>
